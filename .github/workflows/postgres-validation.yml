name: PostgreSQL acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gabby
          POSTGRES_PASSWORD: gabby-test-only
          POSTGRES_DB: gabby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabby -d gabby_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev --extra postgres --python '3.14'
      - name: Verify PostgreSQL knowledge, journal, and manifest contracts
        env:
          GABBY_POSTGRES_DSN: postgresql://gabby:gabby-test-only@localhost:5432/gabby_test
        run: >-
          uv run --no-sync pytest
          tests/integration/test_postgres_indexing_live.py
          tests/integration/test_postgres_knowledge_live.py
          tests/integration/test_postgres_stream_journal_live.py -q

  pgvector-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: gabby
          POSTGRES_PASSWORD: gabby-test-only
          POSTGRES_DB: gabby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabby -d gabby_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev --extra postgres --python '3.14'
      - name: Verify PostgreSQL pgvector contracts
        env:
          GABBY_POSTGRES_DSN: postgresql://gabby:gabby-test-only@localhost:5432/gabby_test
        run: >-
          uv run --no-sync pytest
          tests/integration/test_postgres_vector_live.py -q
