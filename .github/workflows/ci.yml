name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gabby-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - if: runner.os != 'Windows'
        run: uv sync --frozen --group dev --extra server --extra auth --extra observability --extra skill-signing --extra pdf-ocr --extra parquet --extra mcp --python '${{ matrix.python-version }}'
      - if: runner.os == 'Windows'
        run: uv sync --frozen --group dev --extra server --extra auth --extra observability --extra skill-signing --extra pdf-ocr --extra parquet --extra windows-sandbox --extra mcp --python '${{ matrix.python-version }}'
      - run: uv run --no-sync pytest --cov=gabby --cov-report=term-missing

  sandbox-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev --extra server --extra auth --extra observability --extra skill-signing --python '3.14'
      - name: Start and verify Docker daemon
        run: |
          sudo systemctl start docker
          docker info
      - name: Verify Docker and Podman sandbox contracts
        env:
          GABBY_RUN_DOCKER_INTEGRATION: "1"
          GABBY_RUN_PODMAN_INTEGRATION: "1"
        run: >-
          uv run --no-sync pytest
          tests/integration/test_docker_sandbox_live.py
          tests/integration/test_podman_sandbox_live.py -q

  deployment-container:
    uses: ./.github/workflows/container-validation.yml

  postgres-live:
    uses: ./.github/workflows/postgres-validation.yml

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev --extra server --extra auth --extra transformers --extra observability --extra skill-signing --extra pdf-ocr --extra parquet --extra windows-sandbox --extra mcp --python '${{ matrix.python-version }}'
      - run: uv lock --check
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync mypy src/gabby tests scripts examples
      - run: uv run --no-sync python scripts/check_license_headers.py
      - run: uv run --no-sync python scripts/check_workflows.py
      - run: uv run --no-sync python scripts/check_scorecard.py
      - run: uv run --no-sync python scripts/check_documentation.py
      - run: uv run --no-sync pytest --cov=gabby --cov-report=term-missing --cov-report=xml
      - run: uv build --out-dir dist
      - run: uv run --no-sync python scripts/check_package.py dist
      - run: python -m pip install --no-deps --target "$RUNNER_TEMP/gabby-wheel" dist/*.whl
      - run: PYTHONPATH="$RUNNER_TEMP/gabby-wheel" python -c 'import gabby; assert all(hasattr(gabby, name) for name in ("AgentDefinition", "SkillDefinition", "ModelResponse", "TransformersProvider"))'
      - run: uv run --no-sync pip-audit --skip-editable --progress-spinner off
