site_name: Gabby
site_description: Documentation for the Gabby agent governance and execution runtime.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, https://docs.undreamt.in/]
repo_url: https://github.com/undreamt-oss/gabby
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: https://undreamt.in/assets/aistudio/logo_babccb65.png
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/undreamt.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/undreamt-oss/gabby
      name: Gabby on GitHub
  generator: false

nav:
  - Home: index.md
  - Start here:
      - User guide: README_GUIDE.md
      - HTTP client: CLIENT.md
      - Build and preview this site: BUILDING_DOCS.md
  - Concepts:
      - Architecture: ARCHITECTURE.md
      - Host-orchestrated pipelines: HOST_ORCHESTRATED_PIPELINES.md
      - Extension contracts: EXTENSION_CONTRACTS.md
      - Extension guide: EXTENSIONS.md
      - API stability: API_STABILITY.md
      - Compatibility proposal: COMPATIBILITY.md
      - Architecture decisions: architecture/adr/README.md
  - Capabilities:
      - Approvals: APPROVALS.md
      - Structured output: STRUCTURED_OUTPUT.md
      - Skills and registry: SKILL_REGISTRY.md
      - SQLite data tool: SQLITE_DATA.md
      - Sandboxed Python tool: PYTHON_TOOL.md
      - Integrations: INTEGRATIONS.md
  - Operate securely:
      - Threat model: THREAT_MODEL.md
      - Operations: OPERATIONS.md
      - Scaling: SCALING_AND_OPERATIONS.md
      - Container deployment: DEPLOYMENT_CONTAINER.md
      - Kubernetes deployment: DEPLOYMENT_KUBERNETES.md
  - Project:
      - Readiness scorecard: PROJECT_SCORECARD.md
      - OpenSSF audit: OPENSSF_AUDIT.md
      - Repository governance: REPOSITORY_GOVERNANCE.md
      - AI usage: AI_USAGE.md
      - Releasing: RELEASING.md
