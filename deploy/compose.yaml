services:
  gabby:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        UV_IMAGE: ${GABBY_UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.13-python3.14-trixie-slim}
        RUNTIME_IMAGE: ${GABBY_RUNTIME_IMAGE:-python:3.14-slim-trixie}
    image: gabby-hosted-research:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      GABBY_API_TOKEN: ${GABBY_API_TOKEN:?Set GABBY_API_TOKEN in the deployment environment}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in the deployment environment}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
