events {
    worker_connections 128;
}

http {
    limit_req_zone $binary_remote_addr zone=gabby_api:10m rate=10r/s;
    server_tokens off;

    upstream gabby_upstream {
        server 127.0.0.1:8787;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        server_name agents.example.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:gabby_tls:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_certificate /etc/letsencrypt/live/agents.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agents.example.com/privkey.pem;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        client_max_body_size 1000000;
        limit_req_status 429;

        location = /health {
            proxy_pass http://gabby_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location ~ ^/v1/agents/[^/]+/run$ {
            limit_req zone=gabby_api burst=30 nodelay;
            proxy_pass http://gabby_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 140s;
            proxy_send_timeout 140s;
        }

        location ~ ^/v1/agents/[^/]+/stream$ {
            limit_req zone=gabby_api burst=30 nodelay;
            proxy_pass http://gabby_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 140s;
            proxy_send_timeout 140s;
        }

        location / {
            return 404;
        }
    }
}
