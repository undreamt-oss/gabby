[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gabby-agent-runtime"
version = "0.1.0"
description = "A stateless, composable framework for constructing and serving AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gabby Contributors" }]
keywords = ["agents", "ai", "async", "framework", "llm", "stateless"]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22,<5",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/orbit-projects/gabby"
Issues = "https://github.com/orbit-projects/gabby/issues"
Documentation = "https://github.com/orbit-projects/gabby/tree/main/docs"
Security = "https://github.com/orbit-projects/gabby/security/policy"

[project.scripts]
gabby = "gabby.cli:main"

[project.optional-dependencies]
server = ["uvicorn>=0.34,<1"]
auth = ["PyJWT[crypto]>=2.13,<3"]
pdf = ["pypdf>=6.19,<7"]
ocr = ["Pillow>=11,<13", "pytesseract>=0.3.13,<1"]
pdf-ocr = ["pypdf[image]>=6.19,<7", "pypdfium2>=5.13,<6", "pytesseract>=0.3.13,<1"]
parquet = ["pyarrow>=23,<26"]
transformers = ["transformers>=5.18,<6"]
transformers-adapters = ["peft>=0.19.1,<1"]
training = ["accelerate>=1,<2", "peft>=0.19.1,<1"]
windows-sandbox = ["aiohttp>=3.11,<4"]
observability = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
skill-signing = ["cryptography>=44,<51"]
mcp = ["mcp>=2.0.0,<3"]
postgres = ["asyncpg>=0.31,<1"]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
  "pypdf>=6.19,<7",
  "uv==0.12.13",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: opt-in checks that contact external or local services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gabby"]
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
source = ["gabby"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.setuptools.package-data]
gabby = ["py.typed", "sql/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gabby*"]
